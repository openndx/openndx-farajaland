
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.7
    environment:
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=default=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_NAME=default
    networks:
      - exchange-network

  api-gateway:
    depends_on:
      - etcd
    image: apache/apisix:latest
    ports:
      - "9081:9081"
      - "9180:9180"
    networks:
      - exchange-network
    volumes:
      - ./config/apisix/conf.yaml:/usr/local/apisix/conf/config.yaml

  # Stage A: seed the ThunderID image's bundled SQLite DB files into a named
  # volume so thunderid-setup/thunderid see a writable copy.
  thunderid-db-init:
    image: ghcr.io/thunder-id/thunderid:${THUNDERID_IMAGE_TAG:-1.0.1}
    container_name: thunderid-db-init-${ENVIRONMENT:-local}
    # Seed only when the volume is empty. Recreating this container (e.g. after
    # an unrelated env var change) must never overwrite an already-populated
    # volume - a plain `cp -r` would silently wipe existing ThunderID data.
    command: sh -c "[ -f /data/configdb.db ] || cp -r /opt/thunderid/database/* /data/"
    volumes:
      - thunderid-db:/data
    restart: "no"
    networks:
      - exchange-network

  # Stage B: one-shot bootstrap. setup.sh runs ThunderID's in-process orchestrator,
  # which (1) generates the server TLS/JWT-signing/AES key material and the Direct
  # Auth Secret into the thunderid-certs/thunderid-secrets volumes if not already
  # present, then (2) imports every resource-definition file under
  # /opt/thunderid/bootstrap: the image's 01-default-resources.yaml (default OU,
  # Person user type, Administrator role, Console app) plus our mounted files -
  # the ADMIN_CLI M2M client (used by init.sh to mint management tokens), the
  # APISIX gateway M2M client, the consent-portal SPA client, and CORS. Import
  # is upsert-safe, so re-running is a no-op.
  #
  # Neither the passport app's M2M client nor the demo citizen user are here -
  # they're a data-consumer application and a citizen, not exchange
  # infrastructure, so init.sh registers both separately at runtime via
  # ThunderID's /import API once the server is up (see
  # config/thunderid/data-consumers/ and config/thunderid/demo-citizens/).
  thunderid-setup:
    image: ghcr.io/thunder-id/thunderid:${THUNDERID_IMAGE_TAG:-1.0.1}
    container_name: thunderid-setup-${ENVIRONMENT:-local}
    command: ./setup.sh
    depends_on:
      thunderid-db-init:
        condition: service_completed_successfully
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-1234}
      - ADMIN_CLI_SECRET=${ADMIN_CLI_SECRET:-1234}
      - DIRECT_AUTH_SECRET=${DIRECT_AUTH_SECRET:-1234}
      - GATEWAY_CLIENT_SECRET=${GATEWAY_CLIENT_SECRET:-1234}
      - CONSENT_PORTAL_URL=${CONSENT_PORTAL_URL:-http://localhost:5173}
      - PUBLIC_URL=${IDP_BASE_URL:-https://localhost:8090}
      - PORT=${IDP_PORT:-8090}
      - HOSTNAME=0.0.0.0
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-dummy}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-dummy}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-noreply@farajaland.local}
      - SMTP_ENABLE_START_TLS=${SMTP_ENABLE_START_TLS:-false}
      - SMTP_ENABLE_AUTHENTICATION=${SMTP_ENABLE_AUTHENTICATION:-false}
    volumes:
      - thunderid-db:/opt/thunderid/database
      # Per-deployment key material and the Direct Auth Secret, generated here and
      # shared (read-only) with the thunderid service below.
      - thunderid-certs:/opt/thunderid/config/certs
      - thunderid-secrets:/opt/thunderid/config/secrets
      - ./config/thunderid/deployment.yaml:/opt/thunderid/deployment.yaml
      - ./config/thunderid/bootstrap/02-admin-cli.yaml:/opt/thunderid/bootstrap/02-admin-cli.yaml
      - ./config/thunderid/bootstrap/03-gateway-app.yaml:/opt/thunderid/bootstrap/03-gateway-app.yaml
      - ./config/thunderid/bootstrap/04-consent-portal.yaml:/opt/thunderid/bootstrap/04-consent-portal.yaml
      - ./config/thunderid/bootstrap/05-cors.yaml:/opt/thunderid/bootstrap/05-cors.yaml
    restart: "no"
    networks:
      - exchange-network

  thunderid:
    image: ghcr.io/thunder-id/thunderid:${THUNDERID_IMAGE_TAG:-1.0.1}
    container_name: thunderid-${ENVIRONMENT:-local}
    depends_on:
      thunderid-setup:
        condition: service_completed_successfully
    ports:
      - "${IDP_PORT:-8090}:${IDP_PORT:-8090}"
    environment:
      - PUBLIC_URL=${IDP_BASE_URL:-https://localhost:8090}
      - PORT=${IDP_PORT:-8090}
      - HOSTNAME=0.0.0.0
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-dummy}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-dummy}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-noreply@farajaland.local}
      - SMTP_ENABLE_START_TLS=${SMTP_ENABLE_START_TLS:-false}
      - SMTP_ENABLE_AUTHENTICATION=${SMTP_ENABLE_AUTHENTICATION:-false}
    volumes:
      - thunderid-db:/opt/thunderid/database
      - thunderid-certs:/opt/thunderid/config/certs:ro
      - thunderid-secrets:/opt/thunderid/config/secrets:ro
      - ./config/thunderid/deployment.yaml:/opt/thunderid/deployment.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://localhost:${IDP_PORT:-8090}/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - exchange-network

  policy-decision-point:
    depends_on:
      - postgres
    image: ghcr.io/openndx/policy-decision-point:0.3.0
    platform: linux/amd64
    container_name: pdp-${ENVIRONMENT:-local}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - PORT=8082
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      # Database configuration. 0.3.0's PDP reads DB_* (the old
      # CHOREO_OPENDIF_DATABASE_* names and JWT_SECRET/CORS/RATE_LIMIT are no
      # longer read by the service and were silently ignored).
      - DB_HOST=postgres
      - DB_PORT=${PDP_DB_PORT:-5432}
      - DB_USERNAME=${DB_USER:-exchange}
      - DB_PASSWORD=${DB_PASSWORD:-exchange}
      - DB_NAME=${PDP_DB_NAME:-testdb}
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - RUN_MIGRATION=${RUN_MIGRATION:-false}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - exchange-network

  consent-engine:
    depends_on:
      - postgres
      - thunderid
    image: ghcr.io/openndx/consent-engine:0.3.0
    platform: linux/amd64
    container_name: ce-${ENVIRONMENT:-local}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - PORT=8081
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      # Database configuration. 0.3.0's consent-engine doesn't read
      # JWT_SECRET/CORS/RATE_LIMIT or the DB pool/timeout/retry tuning vars below
      # (no such settings exist in its config any more), so they've been dropped.
      - DB_HOST=postgres
      - DB_PORT=${CE_DB_PORT:-5432}
      - DB_USERNAME=${DB_USER:-exchange}
      - DB_PASSWORD=${DB_PASSWORD:-exchange}
      - DB_NAME=${CE_DB_NAME:-consent_engine}
      - DB_SSLMODE=${DB_SSLMODE:-require}
      - CONSENT_PORTAL_URL=${CONSENT_PORTAL_URL:-http://localhost:5173}
      # Generic IdP config (verifier validates issuer + audience + client_id, no org).
      - IDP_ISSUER=${IDP_ISSUER:-https://localhost:8090}
      - IDP_AUDIENCE=${IDP_AUDIENCE:-CONSENT_PORTAL_APP}
      - IDP_CLIENT_ID=${CONSENT_PORTAL_CLIENT_ID:-CONSENT_PORTAL_APP}
      - IDP_JWKS_URL=${IDP_JWKS_URL:-https://thunderid:8090/oauth2/jwks}
      # ThunderID serves a self-signed dev cert; skip TLS verification on the
      # JWKS fetch (matches apisix ssl_verify:false / DIE rejectUnauthorized:false).
      - IDP_JWKS_INSECURE_SKIP_VERIFY=${IDP_JWKS_INSECURE_SKIP_VERIFY:-true}
      # The canonical data-owner UID matched against consent.owner_id. OE sets
      # owner_id straight from the federated query's "nic" argument value, and
      # the DRP/RGD mock data use an email address as that value (see
      # config/thunderid/demo-citizens/mock-user.yaml) - so the claim consent
      # ownership is checked against must be "email", not the default "sub"
      # (ThunderID's auto-generated user UUID, which would never match).
      - IDP_SUBJECT_CLAIM=${IDP_SUBJECT_CLAIM:-email}
      - CORS_ALLOWED_ORIGINS=${CONSENT_PORTAL_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - exchange-network

  consent-portal:
    depends_on:
      - postgres
      - thunderid
    image: ghcr.io/openndx/consent-portal:0.3.0
    ports:
      - "${PORT_CP:-5173}:80"
    platform: linux/amd64
    environment:
      # 0.3.0's consent-portal no longer bakes VITE_* vars in at build time - the
      # image's entrypoint now writes these into a runtime-loaded config.js instead.
      - CONSENT_ENGINE_URL=http://localhost:9081/api/v1
      - IDP_CLIENT_ID=${CONSENT_PORTAL_CLIENT_ID:-consent-portal}
      # IDP_BASE_URL is the IdP the browser is redirected to for login, so it must
      # be reachable from the browser. For this local stack IDP_BASE_URL is
      # https://localhost:8090 (see ndx/.env) - the browser reaches it directly and
      # ThunderID's dev cert is CN=localhost, so no /etc/hosts entry is required.
      - IDP_BASE_URL=${IDP_BASE_URL:-https://localhost:8090}
      - IDP_SCOPE=openid profile email
      - IDP_SIGN_IN_REDIRECT_URL=http://localhost:5173
      - IDP_SIGN_OUT_REDIRECT_URL=http://localhost:5173

  orchestration-engine:
    image: ghcr.io/openndx/orchestration-engine:0.3.0
    platform: linux/amd64
    container_name: oe-${ENVIRONMENT:-local}
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - PORT=4000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - CONFIG_PATH=${CONFIG_PATH:-./config.json}
    volumes:
      - ${OE_CONFIG_PATH}:/app/config.json:ro
      - ${OE_SCHEMA_PATH}:/app/schema.graphql:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - exchange-network

  audit-service:
    image: ghcr.io/opendif/opendif-core/audit-service:0.1.0
    platform: linux/amd64
    container_name: audit-${ENVIRONMENT:-local}
    depends_on:
      - postgres
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - PORT=3001
      - DB_TYPE=${AUDIT_DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=${AUDIT_DB_PORT:-5432}
      - DB_USERNAME=${DB_USER:-exchange}
      - DB_PASSWORD=${DB_PASSWORD:-exchange}
      - DB_NAME=audit_db
    volumes:
      - ./config/audit/enums.yml:/app/config/enums.yaml:ro
    networks:
      - exchange-network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: pg-${ENVIRONMENT:-local}
    environment:
      POSTGRES_USER: ${DB_USER:-exchange}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-exchange}
      POSTGRES_DB: ${DB_NAME:-exchange_service}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./opendif_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./consent_engine_schema.sql:/docker-entrypoint-initdb.d/02_consent_engine_schema.sql
      - ./audit_service_schema.sql:/docker-entrypoint-initdb.d/03_audit_service_schema.sql
    networks:
      - exchange-network
    restart: unless-stopped

networks:
  exchange-network:
    driver: bridge

volumes:
  pg_data:
  thunderid-db:
  thunderid-certs:
  thunderid-secrets: