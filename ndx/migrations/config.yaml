# Connection settings for the migrate tool (OpenNSW/tools migrator). It
# requires host, port (a number), user, password and name, and does not fall
# back to the PG* variables run.sh sets for psql.
# run.sh runs it once per service, setting MIGRATE_DB_NAME and MIGRATE_DIR to
# that service's database and migrations folder.
db:
  driver: postgres
  postgres:
    host: "{{env:DB_HOST}}"
    port: "{{env:DB_PORT}}"
    user: "{{env:DB_USER}}"
    password: "{{env:DB_PASSWORD}}"
    name: "{{env:MIGRATE_DB_NAME}}"
    sslMode: "{{env:DB_SSLMODE}}"
migrationDir: "{{env:MIGRATE_DIR}}"
