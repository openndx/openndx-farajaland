# DRP and RGD are active. Add a configured provider before exposing DMT fields.
directive @deprecated(
    reason: String = "No longer supported"
) on FIELD_DEFINITION | ENUM_VALUE

directive @sourceInfo(
    schemaId: String!
    providerField: String!
) on FIELD_DEFINITION

type Query {
    personInfo(nic: String!): PersonInfo
}

type PersonInfo {
    fullName: String @sourceInfo(schemaId: "drp-schema-v1", providerField: "person.fullName")
    name: String @sourceInfo(schemaId: "abc-212", providerField: "getPersonInfo.name")
    otherNames: String @sourceInfo(schemaId: "drp-schema-v1", providerField: "person.otherNames")
    address: String @sourceInfo(schemaId: "drp-schema-v1", providerField: "person.permanentAddress")
    profession: String @sourceInfo(schemaId: "drp-schema-v1", providerField: "person.profession")
    dateOfBirth: String @sourceInfo(schemaId: "abc-212", providerField: "getPersonInfo.birthDate")
    sex: String @sourceInfo(schemaId: "abc-212", providerField: "getPersonInfo.sex")
    birthInfo: BirthInfo
}

type BirthInfo {
    birthRegistrationNumber: String @sourceInfo(schemaId: "abc-212", providerField: "getPersonInfo.brNo")
    birthPlace: String @sourceInfo(schemaId: "abc-212", providerField: "getPersonInfo.birthPlace")
    district: String @sourceInfo(schemaId: "abc-212", providerField: "getPersonInfo.district")
}
