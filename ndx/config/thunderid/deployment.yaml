server:
  # Literal on purpose - NOT a Go-template placeholder like the SMTP fields below:
  # thunderid-setup's own setup.sh reads these three fields with `yq` straight off
  # this file, before the Go binary's env-var substitution ever runs. An unquoted,
  # unsubstituted template placeholder here parses as a YAML flow-mapping, which
  # setup.sh then re-exports as the (mangled) env var the Go binary substitutes
  # with, corrupting it too. Matches ghcr.io/thunder-id/thunderid's own shipped
  # default and openndx-core's reference deployment.yaml, which use literals here
  # for the same reason. If IDP_PORT/IDP_BASE_URL in ndx/.env ever need to change,
  # update these to match.
  hostname: "0.0.0.0"
  public_url: "https://localhost:8090"
  port: 8090
  security:
    # Gates ThunderID's Direct API (atomic auth / /flow/execute). 1.0.1 moved this
    # from a plain deployment.yaml value to a generated secret file: setup.sh writes
    # DIRECT_AUTH_SECRET (passed as an env var, see docker-compose.yml) into
    # config/secrets/direct_auth_secret, and the server reads it from there.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

# 1.0.1 renamed/split the database set: `user` -> `entity`, and `runtime`/`operation`
# -> `runtime_transient`/`runtime_persistent`. The image's seeded database files
# under /opt/thunderid/database use these same names (see thunderid-db-init).
database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_transient:
    type: "sqlite"
    sqlite:
      path: "database/runtime_transient.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime_persistent:
    type: "sqlite"
    sqlite:
      path: "database/runtime_persistent.db"
      options: "_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

# Key material (server TLS, JWT signing, AES encryption) is generated by setup.sh
# into config/certs on first run (no longer image-provided), and persisted in the
# thunderid-certs volume - see docker-compose.yml.
crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
  preferred_key_id: "default-key"

# NOTE: the static `cors:` block was removed well before 1.0.1 - the config schema
# doesn't accept it (CORS is dynamic / configured via the server-config bootstrap
# resource - see config/thunderid/bootstrap/06-cors.yaml). Leaving it here makes the
# server fail to start.

passkey:
  allowed_origins:
    - "https://localhost:8090"

email:
  smtp:
    host: {{.SMTP_HOST}}
    port: {{.SMTP_PORT}}
    username: {{.SMTP_USERNAME}}
    password: {{.SMTP_PASSWORD}}
    from_address: {{.SMTP_FROM_ADDRESS}}
    enable_start_tls: {{.SMTP_ENABLE_START_TLS}}
    enable_authentication: {{.SMTP_ENABLE_AUTHENTICATION}}

# NOTE: the built-in `consent:` block (an in-IDP consent repository) doesn't exist
# in 1.0.1 - /opt/thunderid/consent is gone from the image entirely. This was
# already disabled here (consent.enabled: false) since this stack uses the
# standalone consent-engine service instead, so there's nothing to migrate.
