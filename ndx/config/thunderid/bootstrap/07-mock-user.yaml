# ============================================================================
# LOCAL-DEV ONLY: a sample citizen/data-owner account for testing the consent
# portal's login flow and the passport app's federated query without
# registering a user through the UI first. Matches the DRP/RGD mock data's
# "nayana@opensource.lk" record (members/drp/data-sources/drp-api/mock_data.json).
#
# {{ .MOCK_USER_PASSWORD }} is resolved from the container environment at
# bootstrap time (see ndx/.env).
#
resource_type: user
id: 01900000-0000-7000-8000-0000000000d1
type: Person
ouHandle: default
attributes:
  username: nayana
  email: nayana@opensource.lk
  given_name: Nayana
  family_name: Samaranayake
credentials:
  password: "{{ .MOCK_USER_PASSWORD }}"
