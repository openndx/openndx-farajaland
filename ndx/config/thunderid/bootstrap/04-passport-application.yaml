# ============================================================================
# Declarative bootstrap resource: the Online Passport App's M2M application.
#
# Used by members/run-member-services.sh (the `die` service) to call the
# federated GraphQL API via the APISIX public route as a data-consuming
# application. {{ .PASSPORT_CLIENT_SECRET }} is resolved from the container
# environment at bootstrap time (see ndx/.env); run-member-services.sh reads
# the same value via init.sh so the two agree without a per-run handoff.
#
resource_type: application
id: 01900000-0000-7000-8000-0000000000c2
name: Passport Application
description: M2M client used by the Online Passport App
type: m2m
ouId: 01900000-0000-7000-8000-000000000001
allowedUserTypes: []
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: passport-app
      clientSecret: "{{ .PASSPORT_CLIENT_SECRET }}"
      grantTypes:
        - client_credentials
      tokenEndpointAuthMethod: client_secret_basic
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
