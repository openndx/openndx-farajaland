# Local-demo identity schema. The mock providers use email-shaped NIC values.
# Keeping nic equal to their existing identifier preserves consent ownership.
resource_type: user_type
id: 01900000-0000-7000-8000-000000000032
category: user
name: Citizen
ouHandle: default
allowSelfRegistration: false
systemAttributes:
  display: username
schema:
  username:
    type: string
    displayName: Username
    required: true
    unique: true
  nic:
    type: string
    displayName: Demo Citizen Identifier
    required: true
    unique: true
  email:
    type: string
    displayName: Email
    required: true
  given_name:
    type: string
    displayName: First Name
    required: false
  family_name:
    type: string
    displayName: Last Name
    required: false
  password:
    type: string
    displayName: Password
    required: false
    credential: true
