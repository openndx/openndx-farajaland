name: Release member images

# Push a tag named <image>/v<version>, e.g. rgd-api/v0.2.0, to publish that
# image for linux/amd64 and linux/arm64 to ghcr.io/<owner>/<image>:<version>.
on:
  push:
    tags:
      - "rgd-api/v*"
      - "online-passport-app/v*"
  workflow_dispatch:
    inputs:
      image:
        description: Image to release
        required: true
        type: choice
        options:
          - rgd-api
          - online-passport-app
      version:
        description: Version tag to publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image and version
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            image="$INPUT_IMAGE"
            version="$INPUT_VERSION"
          else
            image="${REF_NAME%%/*}"
            version="${REF_NAME#*/}"
          fi
          case "$image" in
            rgd-api) context=members/rgd/data-sources/rgd-api ;;
            online-passport-app) context=members/die/applications/online-passport-app ;;
            *) echo "::error::Unknown image: $image"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3, got: $version"
            exit 1
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "context=$context"
            echo "image=ghcr.io/$owner/$image"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          tags: type=raw,value=${{ steps.target.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.target.outputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.target.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.image }}
